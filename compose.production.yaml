# Use with: docker compose -f compose.yaml -f compose.production.yaml up -d --build
# Only the edge publishes web ports. Application, database and Redis stay internal.
services:
  backend:
    # Keep the verified production heap override when rebuilding the shared image.
    entrypoint: ["java", "-Xmx4g", "-jar", "app.jar"]
    environment:
      MANUAL_ORDERS_ENABLED: "true"
      ASSET_HISTORY_EQUITY_READ_ENABLED: "true"
      ASSET_HISTORY_EQUITY_COLLECT_ENABLED: "true"
      ASSET_HISTORY_CACHE_ENABLED: "true"
      ASSET_HISTORY_CACHE_NAMESPACE: "705:production"
      ASSET_HISTORY_CACHE_TIMEOUT_MS: "200"
      ASSET_HISTORY_CACHE_HOUR_TTL_SECONDS: "7200"
      ASSET_HISTORY_CACHE_FOUR_HOUR_TTL_SECONDS: "28800"
      ASSET_HISTORY_CACHE_DAY_TTL_SECONDS: "172800"
  admin:
    ports: !reset []
  mobile:
    ports: !reset []
  pc:
    ports: !reset []
  edge:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - pc
      - admin
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
