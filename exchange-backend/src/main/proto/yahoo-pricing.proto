syntax = "proto3";
option java_package = "com.gtcfesk.exchange.market.yahoo";
option java_outer_classname = "YahooPricing";
// Wire fields documented by https://github.com/ranaroussi/yfinance/blob/main/yfinance/pricing.proto
// Optional presence prevents missing statistics from overwriting valid values with zero.
message PricingData {
  string id = 1;
  float price = 2;
  sint64 time = 3;
  string currency = 4;
  string exchange = 5;
  int32 quote_type = 6;
  int32 market_hours = 7;
  optional float change_percent = 8;
  optional sint64 day_volume = 9;
  optional float day_high = 10;
  optional float day_low = 11;
  optional float change = 12;
  optional float previous_close = 16;
  optional float bid = 23;
  optional float ask = 25;
}
