map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 10m;

    location /mobile/ {
        resolver 127.0.0.11 valid=10s;
        set $mobile_backend mobile:80;
        rewrite ^/mobile/(.*)$ /$1 break;
        proxy_pass http://$mobile_backend;
        proxy_set_header Host $host;
    }

    location ^~ /demo-api/ {
        resolver 127.0.0.11 valid=10s;
        set $demo_backend demo-backend:8080;
        rewrite ^/demo-api/(.*)$ /api/$1 break;
        proxy_pass http://$demo_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
    location ^~ /demo-uploads/ {
        resolver 127.0.0.11 valid=10s;
        set $demo_backend demo-backend:8080;
        rewrite ^/demo-uploads/(.*)$ /uploads/$1 break;
        proxy_pass http://$demo_backend;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(api|uploads)/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}
