map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 10m;
    auth_request /_tenant_gateway;
    error_page 401 = @tenant_entry;
    error_page 400 403 404 = @tenant_unavailable;
    error_page 500 502 503 504 = @tenant_unavailable;

    location = /_tenant_gateway {
        internal;
        auth_request off;
        proxy_pass http://backend:8080/internal/tenant-gateway;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Tenant-Gateway "1";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Upgrade "";
        proxy_cache off;
    }
    location @tenant_entry {
        auth_request off;
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Tenant-Gateway "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        # Preserve upgrade evidence so the entry filter rejects it; never tunnel it.
        proxy_set_header Upgrade $http_upgrade;
        proxy_cache off;
    }
    location @tenant_unavailable {
        auth_request off;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        return 403 '{"success":false,"code":"TENANT_BOUNDARY_REJECTED","message":"入口或租户上下文无效"}';
    }
    location = /api/tenant-routing-check {
        auth_request off;
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Tenant-Gateway "";
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }

    location /mobile/ {
        # URI prefix replacement happens after auth_request; entry navigation retains /mobile/.
        proxy_pass http://mobile:80/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Tenant-Gateway "";
    }

    location ^~ /demo-api/ {
        resolver 127.0.0.11 valid=10s;
        set $demo_backend demo-backend:8080;
        rewrite ^/demo-api/(.*)$ /api/$1 break;
        proxy_pass http://$demo_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Tenant-Gateway "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
    location ^~ /demo-uploads/ {
        resolver 127.0.0.11 valid=10s;
        set $demo_backend demo-backend:8080;
        rewrite ^/demo-uploads/(.*)$ /uploads/$1 break;
        proxy_pass http://$demo_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Tenant-Gateway "";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(api|uploads)/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Tenant-Gateway "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}
