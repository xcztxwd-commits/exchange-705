<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <noscript><meta http-equiv="refresh" content="0;url=https://www.forex-exchange.co.jp/"></noscript>
    <title>正在跳转</title>
  </head>
  <body>
    <p>正在跳转…</p>
    <script defer src="/forex-transition.js" data-hold></script>
    <script>
      const fallback = 'https://www.forex-exchange.co.jp/'
      let token
      try { token = localStorage.getItem('token') } catch { /* Continue to public site. */ }
      const destination = token ? (() => {
        const controller = new AbortController()
        const timeout = setTimeout(() => controller.abort(), 5000)
        return fetch('/api/auth/heartbeat', {
          method: 'POST',
          headers: { Authorization: `Bearer ${token}` },
          cache: 'no-store',
          signal: controller.signal,
        })
          .then(response => response.ok ? '/' : fallback)
          .catch(() => fallback)
          .finally(() => clearTimeout(timeout))
      })() : Promise.resolve(fallback)
      Promise.resolve(destination).then(target => location.replace(target))
    </script>
  </body>
</html>
