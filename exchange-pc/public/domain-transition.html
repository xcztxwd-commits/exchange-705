<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <noscript><meta http-equiv="refresh" content="0;url=/"></noscript>
    <title>正在跳转</title>
  </head>
  <body>
    <p>正在跳转…</p>
    <script>
      const requested = location.search.startsWith('?next=') ? location.search.slice(6) : '/'
      let next
      try { next = new URL(requested, location.origin) } catch { next = new URL('/', location.origin) }
      const safe = next.origin === location.origin && next.pathname !== '/domain-transition.html'
      location.replace(safe ? next.href : `${location.origin}/`)
    </script>
  </body>
</html>
